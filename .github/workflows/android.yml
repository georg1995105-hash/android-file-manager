name: android

on:
  push:
    branches:
      - '**'
      - '!apk-downloads'
      - '!ci-screenshots'
      - '!ci-device-shots'
      - '!ci-device-shots-tablet'
    paths-ignore:
      - '.github/workflows/release-preflight.yml'
      - '.github/workflows/release-key-setup.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      device_tests:
        description: 'Run full Android emulator UI checks (phone + tablet)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Release-подпись включается, только когда владелец добавил секреты (см. docs/SIGNING.md).
      HAS_RELEASE_KEY: ${{ secrets.PFM_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Существующий ключ не пересоздаётся: cache miss/чужой сертификат останавливают сборку.
      - name: Restore existing debug keystore cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: pfm-debug-keystore-v1
      - name: Restore debug keystore
        env:
          PFM_DEBUG_KEYSTORE_B64: ${{ secrets.PFM_DEBUG_KEYSTORE_B64 }}
        run: bash tools/restore_debug_keystore.sh

      # Robolectric скачивает android-all один раз; кэшируем между запусками.
      - name: Cache Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Screenshots (manual full-check only)
        if: github.event_name == 'workflow_dispatch' && inputs.device_tests
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest -Pscreenshots --tests "*ScreenshotTest" 2>&1 | tee screenshots.log || {
            echo "===== SCREENSHOT ERRORS ====="
            grep -E '^e: |FAILED|Exception|Caused by|^\s+at (org.robolectric|androidx.compose)' screenshots.log | head -120
            exit 1
          }

      # Краткая сводка ошибок в конце лога (для удалённого разбора без полного лога).
      - name: Error summary
        if: failure()
        run: |
          echo "===== COMPILER ERRORS ====="
          grep -E '^e: ' build.log | head -80 || true
          echo "===== FAILED TESTS ====="
          grep -E 'FAILED|Test.*>.*FAILED|AssertionError|expected:' build.log | head -60 || true
          echo "===== WHAT WENT WRONG ====="
          grep -A8 'What went wrong' build.log | head -60 || true

      - name: Inspect APK
        id: apk
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          # dist/ — только то, что ставит пользователь (подписанный RELEASE universal, шаг ниже).
          # DEBUG-сборка проверяется здесь и кладётся в debug-dist/ только для служебного пререлиза [apk].
          mkdir -p dist debug-dist
          for SRC in app/build/outputs/apk/debug/*universal*.apk; do
            ABI=universal
            "$BT/aapt2" dump badging "$SRC" > badging.txt
            VN=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt | head -1)
            VC=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" badging.txt | head -1)
            PKG=$(sed -n "s/package: name='\([^']*\)'.*/\1/p" badging.txt | head -1)
            OUT="debug-dist/personal-file-manager-${VN}-vc${VC}-${ABI}-${SHORT}.apk"
            cp "$SRC" "$OUT"
            echo "===== $OUT"
            echo "package: $PKG  versionName: $VN  versionCode: $VC  size: $(stat -c %s "$OUT")"
            grep "uses-permission" badging.txt || true
            bash tools/check_debug_signatures.sh "$OUT"
            "$BT/zipalign" -c -P 16 4 "$OUT" && echo "zipalign -P 16: OK" || echo "zipalign -P 16: FAIL"
            python3 tools/check_16k.py "$OUT" || true
          done
          (cd debug-dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "name=personal-file-manager-${VN%-debug}-vc${VC}-${SHORT}"
            echo "version_name=$VN"
            echo "version_code=$VC"
          } >> "$GITHUB_OUTPUT"

      # Release-сборка: с ключом владельца — подписанная (для постоянной установки и обновлений);
      # без ключа — только проверка, что R8 и lint проходят (такой APK не устанавливается).
      - name: Release APK
        continue-on-error: ${{ env.HAS_RELEASE_KEY != 'true' }}
        env:
          PFM_KEYSTORE_B64: ${{ secrets.PFM_KEYSTORE_B64 }}
          PFM_STORE_PASSWORD: ${{ secrets.PFM_STORE_PASSWORD }}
          PFM_KEY_ALIAS: ${{ secrets.PFM_KEY_ALIAS }}
          PFM_KEY_PASSWORD: ${{ secrets.PFM_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$HAS_RELEASE_KEY" = "true" ]; then
            bash tools/build_signed_release.sh 2>&1 | tee release.log
          else
            ./gradlew --no-daemon --no-configuration-cache assembleRelease 2>&1 | tee release.log
          fi

      # Скриншоты экранов (тестовые образцы, без личных данных) — в отдельную ветку для сверки с макетом.
      - name: Publish screenshots
        if: always() && hashFiles('app/build/screenshots/*.png') != ''
        run: |
          set -euo pipefail
          cd app/build/screenshots
          git init -q -b ci-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Скриншоты для ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

      - name: Upload signed APK artifact
        id: upload_signed_apk
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/
          retention-days: 30

      # The signed RELEASE is also published to a plain Git branch.
      # This avoids GitHub Release API permission failures and gives Android a stable direct APK URL.
      - name: Publish verified signed APK to direct-download branch
        if: env.HAS_RELEASE_KEY == 'true' && github.ref == 'refs/heads/feature/compact-create-files-20261110'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          records=json.loads(Path('RELEASE_IDENTITY.json').read_text())
          assert len(records) == 1
          r=records[0]
          assert r['package']=='io.personal.filemanager'
          assert r['signature_verified'] and not r['debuggable']
          assert r['certificate_sha256']=='d282ae0bb49c30bd848fcae3ae02533ff446a12ef7e3691863af53c4aa0ecda7'
          assert Path(r['file']).is_file()
          print(f"Validated signed {r['version_name']} vc{r['version_code']}: {r['file']}")
          PY
          cd ..

          WORK="$RUNNER_TEMP/apk-downloads"
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$WORK"
          cd "$WORK"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/apk-downloads >/dev/null 2>&1; then
            git fetch --quiet origin apk-downloads
            git checkout --quiet -B apk-downloads origin/apk-downloads
          else
            git checkout --quiet --orphan apk-downloads
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$GITHUB_WORKSPACE"/dist/*.apk .
          cp "$GITHUB_WORKSPACE/dist/SHA256SUMS.txt" .
          cp "$GITHUB_WORKSPACE/dist/RELEASE_IDENTITY.json" .
          git add *.apk SHA256SUMS.txt RELEASE_IDENTITY.json
          if git diff --cached --quiet; then
            echo "Direct-download branch already contains this signed APK."
            exit 0
          fi
          git commit -m "Publish signed APK for ${GITHUB_SHA::7}"
          git push --quiet origin apk-downloads

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

  # Full device suites run only when explicitly requested. Normal commits build, unit-test and sign APK.
  # Avoid 2 large emulator runs for each tiny UI correction; keep regressions available on demand.
  device-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.device_tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: phone
            profile: pixel_7
            shots-branch: ci-device-shots
          - device: tablet
            profile: pixel_tablet
            shots-branch: ci-device-shots-tablet
    steps:
      # Эмулятору нужно ~7.4 ГБ под userdata; на стандартном раннере свободно меньше.
      # Удаляем предустановленные SDK, не нужные проекту (Java и Android SDK не трогаем).
      - name: Free disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/julia* /usr/local/share/powershell \
            /usr/local/share/chromium /usr/local/lib/node_modules || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore existing debug keystore cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: pfm-debug-keystore-v1
      - name: Restore debug keystore
        env:
          PFM_DEBUG_KEYSTORE_B64: ${{ secrets.PFM_DEBUG_KEYSTORE_B64 }}
        run: bash tools/restore_debug_keystore.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build app and test APKs
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Fixtures
        run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 tools/make_fixtures.py fixtures
      - name: Emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE: ${{ matrix.device }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: ${{ matrix.profile }}
          disk-size: 4096M
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/device_tests.sh
      - name: Publish device screenshots
        if: always() && hashFiles('device-shots/*.png') != ''
        run: |
          set -euo pipefail
          cd device-shots
          git init -q -b "${{ matrix.shots-branch }}"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Скриншоты эмулятора (${{ matrix.device }}) для ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" "${{ matrix.shots-branch }}"
