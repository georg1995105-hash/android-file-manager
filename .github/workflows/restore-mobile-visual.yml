name: Original touch UI screenshot acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore debug signing identity
        env:
          PFM_DEBUG_KEYSTORE_B64: ${{ secrets.PFM_DEBUG_KEYSTORE_B64 }}
        run: bash tools/restore_debug_keystore.sh
      - name: Generate original phone-screen screenshots
        run: ./gradlew --no-daemon testDebugUnitTest -Pscreenshots --tests '*ScreenshotTest'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: original-touch-ui-screenshots
          path: |
            app/build/screenshots/*.png
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
