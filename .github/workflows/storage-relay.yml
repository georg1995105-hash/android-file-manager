name: Storage relay
on:
  push:
    branches: ['feature/storage-first-20261124']
    paths: ['storage-server/**', '.github/workflows/storage-relay.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd storage-server && python3 -m unittest -v
