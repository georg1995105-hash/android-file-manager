name: signed release acceptance

on:
  push:
    branches: ['main']
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require main source
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile signing and upgrade tooling
        run: |
          python3 -m py_compile tools/release_signing.py tools/release_upgrade.py
          bash -n tools/build_signed_release.sh tools/build_release_update_pair.sh
      - name: Build actual main release and a disposable next-version release
        env:
          PFM_KEYSTORE_B64: ${{ secrets.PFM_KEYSTORE_B64 }}
          PFM_STORE_PASSWORD: ${{ secrets.PFM_STORE_PASSWORD }}
          PFM_KEY_ALIAS: ${{ secrets.PFM_KEY_ALIAS }}
          PFM_KEY_PASSWORD: ${{ secrets.PFM_KEY_PASSWORD }}
        run: bash tools/build_release_update_pair.sh
      - name: Free emulator disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed RELEASE update without uninstall or data clearing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 tools/release_upgrade.py --previous dist/current/*universal*.apk --next dist/validation-next/*universal*.apk --certificate-file tools/release-signing.sha256 --report dist/current/RELEASE_UPGRADE.json
      - name: Failure evidence from disposable emulator only
        if: failure()
        run: |
          adb logcat -d -t 400 > release-emulator.log 2>/dev/null || true
          adb exec-out screencap -p > release-emulator.png 2>/dev/null || true
          adb shell uiautomator dump /sdcard/Download/pfm-release-failure.xml >/dev/null 2>&1 || true
          adb pull /sdcard/Download/pfm-release-failure.xml release-emulator.xml >/dev/null 2>&1 || true
      - name: Preserve APKs and public verification evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-release-verification
          path: |
            dist/current/
            release-emulator.log
            release-emulator.png
            release-emulator.xml
          retention-days: 30
      - name: Publish verified APKs in the private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh repo view "$GITHUB_REPOSITORY" --json isPrivate -q .isPrivate)" = true
          read -r VN VC < <(python3 -c 'import json; r=json.load(open("dist/current/RELEASE_IDENTITY.json"))[0]; print(r["version_name"],r["version_code"])')
          TAG="v${VN}-release-vc${VC}-${GITHUB_SHA::7}"
          python3 - <<'PY' > release-notes.md
          import json
          reports = json.load(open('dist/current/RELEASE_IDENTITY.json'))
          check = json.load(open('dist/current/RELEASE_UPGRADE.json'))
          assert check['result'] == 'PASS'
          r = reports[0]
          print(f'Signed RELEASE APK, {r["package"]}, {r["version_name"]}, versionCode {r["version_code"]}.')
          print(f'Certificate SHA-256: {r["certificate_sha256"]}.')
          print('API-35 emulator: a later release build kept the same certificate, UID and note title/body after install -r.')
          print('The later-version validation APK is not published. DEBUG installations are not changed or removed.')
          for item in reports:
              print(f'\n{item["file"]}\nSHA-256: {item["sha256"]}')
          PY
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its APKs"
            exit 1
          fi
          gh release create "$TAG" dist/current/*.apk dist/current/*.json dist/current/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Personal File Manager $VN — signed RELEASE vc$VC" --notes-file release-notes.md
