name: android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Постоянный DEBUG-ключ тестовых сборок между запусками CI, чтобы тестовые APK
      # обновлялись друг поверх друга. Это НЕ release-ключ.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pfm-debug-keystore-v1

      # Robolectric скачивает android-all один раз; кэшируем между запусками.
      - name: Cache Robolectric
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests and debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Screenshots (non-blocking)
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest -Pscreenshots --tests "*ScreenshotTest" 2>&1 | tee screenshots.log || {
            echo "===== SCREENSHOT ERRORS ====="
            grep -E '^e: |FAILED|Exception|Caused by|^\s+at (org.robolectric|androidx.compose)' screenshots.log | head -120
            exit 1
          }

      # Краткая сводка ошибок в конце лога (для удалённого разбора без полного лога).
      - name: Error summary
        if: failure()
        run: |
          echo "===== COMPILER ERRORS ====="
          grep -E '^e: ' build.log | head -80 || true
          echo "===== FAILED TESTS ====="
          grep -E 'FAILED|Test.*>.*FAILED|AssertionError|expected:' build.log | head -60 || true
          echo "===== WHAT WENT WRONG ====="
          grep -A8 'What went wrong' build.log | head -60 || true

      - name: Inspect APK
        id: apk
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          mkdir -p dist
          for SRC in app/build/outputs/apk/debug/*.apk; do
            case "$SRC" in *arm64-v8a*) ABI=arm64 ;; *universal*) ABI=universal ;; *) ABI=other ;; esac
            "$BT/aapt2" dump badging "$SRC" > badging.txt
            VN=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt | head -1)
            VC=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" badging.txt | head -1)
            PKG=$(sed -n "s/package: name='\([^']*\)'.*/\1/p" badging.txt | head -1)
            OUT="dist/personal-file-manager-${VN}-vc${VC}-${ABI}-${SHORT}.apk"
            cp "$SRC" "$OUT"
            echo "===== $OUT"
            echo "package: $PKG  versionName: $VN  versionCode: $VC  size: $(stat -c %s "$OUT")"
            grep "uses-permission" badging.txt || true
            "$BT/apksigner" verify --print-certs "$OUT" | grep -E "SHA-256" || true
            "$BT/zipalign" -c -P 16 4 "$OUT" && echo "zipalign -P 16: OK" || echo "zipalign -P 16: FAIL"
            python3 tools/check_16k.py "$OUT" || true
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)
          {
            echo "name=personal-file-manager-${VN}-vc${VC}-${SHORT}"
            echo "version_name=$VN"
            echo "version_code=$VC"
          } >> "$GITHUB_OUTPUT"

      # Скриншоты экранов (тестовые образцы, без личных данных) — в отдельную ветку для сверки с макетом.
      - name: Publish screenshots
        if: always() && hashFiles('app/build/screenshots/*.png') != ''
        run: |
          set -euo pipefail
          cd app/build/screenshots
          git init -q -b ci-screenshots
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add .
          git commit -qm "Скриншоты для ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: dist/
          retention-days: 30

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      # Приватный пререлиз со скачиваемым APK — только для коммитов с меткой [apk].
      - name: Private prerelease
        if: contains(github.event.head_commit.message, '[apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.apk.outputs.version_name }}-build${{ github.run_number }}"
          gh release create "$TAG" \
            dist/*.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TAG (DEBUG/TEST)" \
            --notes "DEBUG/TEST APK, не постоянная release-сборка. versionCode ${{ steps.apk.outputs.version_code }}. Для vivo X300 Pro — файл *-arm64-*.apk; *-universal-* — для любых устройств. SHA-256 — в SHA256SUMS.txt. Коммит $GITHUB_SHA. Подписан тестовым debug-ключом CI: release-версию поверх установить нельзя без удаления."
