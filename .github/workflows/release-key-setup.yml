name: create owner-backed release identity

on:
  push:
    paths: ['.github/workflows/release-key-setup.yml']

permissions:
  contents: read

concurrency:
  group: pfm-release-identity-setup
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Standard owner-backup and Secrets encryption
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          python3 -m pip install --quiet PyNaCl
      - name: Create exactly one owner-backed release identity
        env:
          PFM_KEYSTORE_B64: ${{ secrets.PFM_KEYSTORE_B64 }}
          PFM_STORE_PASSWORD: ${{ secrets.PFM_STORE_PASSWORD }}
          PFM_KEY_ALIAS: ${{ secrets.PFM_KEY_ALIAS }}
          PFM_KEY_PASSWORD: ${{ secrets.PFM_KEY_PASSWORD }}
          PFM_BACKUP_RECIPIENT: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHAWmaQ6IIoGjxof3/vokeL92N46B+HAZ4I6lTYFpf4f'
          PFM_GITHUB_PUBLIC_KEY: '0AT1OLdG3PRrZ9MOuWrq8JT8UT1nH5Gq5Rm341iZBD8='
          PFM_GITHUB_PUBLIC_KEY_ID: '3380204578043523366'
        run: python3 tools/create_release_identity.py
