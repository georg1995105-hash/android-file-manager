name: Signed APK install and in-place upgrade on Android TV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-tv-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        api: [28, 30]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Free disk and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/share/boost /opt/hostedtoolcache/CodeQL || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify signed APK vc39→vc40 without uninstall
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86
          target: android-tv
          profile: tv_1080p
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: API_LEVEL=${{ matrix.api }} bash tools/production_tv_upgrade.sh
      - name: Preserve release installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signed-tv-upgrade-api-${{ matrix.api }}
          path: |
            signed-tv-*.log
            signed-tv-*.txt
            signed-tv-release.png
          retention-days: 7
