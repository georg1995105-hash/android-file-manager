name: probe-versions
on:
  push:
    paths: ['.github/workflows/probe-versions.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Latest stable versions
        run: |
          m() { echo "== $1"; curl -sSL "$2" | grep -oE '<version>[^<]+' | sed 's/<version>//' | grep -viE 'alpha|beta|rc|dev|eap|-M[0-9]' | tail -5 | tr '\n' ' '; echo; }
          G=https://dl.google.com/dl/android/maven2
          m AGP $G/com/android/tools/build/gradle/maven-metadata.xml
          m COMPOSE_BOM $G/androidx/compose/compose-bom/maven-metadata.xml
          m MATERIAL3 $G/androidx/compose/material3/material3/maven-metadata.xml
          m ICONS_EXT $G/androidx/compose/material/material-icons-extended/maven-metadata.xml
          m ACTIVITY $G/androidx/activity/activity-compose/maven-metadata.xml
          m LIFECYCLE $G/androidx/lifecycle/lifecycle-runtime-compose/maven-metadata.xml
          m NAV $G/androidx/navigation/navigation-compose/maven-metadata.xml
          m DATASTORE $G/androidx/datastore/datastore-preferences/maven-metadata.xml
          m CORE $G/androidx/core/core-ktx/maven-metadata.xml
          m MEDIA3 $G/androidx/media3/media3-exoplayer/maven-metadata.xml
          m ROOM $G/androidx/room/room-runtime/maven-metadata.xml
          m KSP https://repo.maven.apache.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml
          m KOTLIN https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml
          m SERIALIZATION https://repo.maven.apache.org/maven2/org/jetbrains/kotlinx/kotlinx-serialization-json/maven-metadata.xml
          m COIL https://repo.maven.apache.org/maven2/io/coil-kt/coil3/coil-compose/maven-metadata.xml
          echo "== SDK"; ls $ANDROID_HOME/platforms $ANDROID_HOME/build-tools; java -version 2>&1 | head -1
