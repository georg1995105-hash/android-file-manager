name: signing diagnostics

# A PR based on the old branch can read that branch's existing cache. Nothing is
# saved back to the cache, and no keystore is uploaded or printed.
on:
  pull_request:
    branches: ['ccr-01aed2a6-se8umi']
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing regression tests
        run: |
          python3 tools/test_ci_signing.py -v
          bash -n tools/restore_debug_keystore.sh tools/check_debug_signatures.sh tools/device_tests.sh
      - name: Compile instrumentation tests without signing
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:compileDebugAndroidTestKotlin --dry-run | tee tasks.log
          if grep -q ':app:validateSigning' tasks.log; then
            echo "Unexpected signing dependency; refusing to generate a key"
            exit 1
          fi
          ./gradlew --no-daemon :app:compileDebugAndroidTestKotlin

  upgrade:
    needs: compile-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Read existing debug keystore cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: pfm-debug-keystore-v1
      - name: Require original certificate before building APKs
        run: bash tools/restore_debug_keystore.sh
      - name: Build app and instrumentation APKs with preserved key
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Compare historical and rebuilt APK certificates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.8.0-debug-build22 --repo "$GITHUB_REPOSITORY" --pattern '*universal*.apk' --dir incident/previous
          gh run download 40305412451 --repo "$GITHUB_REPOSITORY" --name personal-file-manager-0.9.0-debug-vc10-a4939b7 --dir incident/current-build
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "Historical incident #40305412451: phone app/test APKs were not retained; their exact fingerprints are unavailable."
            for APK in incident/previous/*.apk incident/current-build/*universal*.apk app/build/outputs/apk/debug/*universal*.apk app/build/outputs/apk/androidTest/debug/*.apk; do
              echo "APK: $APK"
              "$BT/apksigner" verify --print-certs "$APK" | grep 'certificate SHA-256 digest:'
            done
            bash tools/check_debug_signatures.sh incident/previous/*.apk app/build/outputs/apk/debug/*universal*.apk app/build/outputs/apk/androidTest/debug/*.apk
          } | tee certificates.txt
          cat certificates.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Free emulator disk space and enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/julia* /usr/local/share/powershell /usr/local/share/chromium /usr/local/lib/node_modules
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade only, preserving the note
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          DEVICE: phone
          DEVICE_TEST_SCOPE: upgrade
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disk-size: 4096M
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash tools/device_tests.sh
      - name: Preserve certificate evidence and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signing-diagnostics
          path: |
            certificates.txt
            upgrade-seed.log
            upgrade-verify.log
          retention-days: 7
