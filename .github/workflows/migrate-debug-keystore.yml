name: seal original debug keystore

# Temporary PR workflow: read the base branch's existing cache without rewriting it.
on:
  pull_request:
    branches: ['ccr-01aed2a6-se8umi']
    paths: ['.github/workflows/migrate-debug-keystore.yml']

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Read preserved key without saving cache changes
        uses: actions/cache/restore@v4
        with:
          path: ~/.android/debug.keystore
          key: pfm-debug-keystore-v1
      - name: Verify original signing identity
        run: bash tools/restore_debug_keystore.sh
      - name: Prepare sealed-box encryption
        run: python3 -c 'import nacl.public' || python3 -m pip install --quiet PyNaCl
      - name: Seal existing keystore to the repository Secrets public key
        env:
          REPO_SECRETS_PUBLIC_KEY: 0AT1OLdG3PRrZ9MOuWrq8JT8UT1nH5Gq5Rm341iZBD8=
          REPO_SECRETS_PUBLIC_KEY_ID: '3380204578043523366'
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          from nacl.public import PublicKey, SealedBox

          public_key = PublicKey(base64.b64decode(os.environ['REPO_SECRETS_PUBLIC_KEY'], validate=True))
          existing_key = (Path.home() / '.android/debug.keystore').read_bytes()
          encrypted_value = SealedBox(public_key).encrypt(base64.b64encode(existing_key))
          # Only GitHub can decrypt this ciphertext. Never print the key or its base64.
          print('PFM_DEBUG_KEYSTORE_KEY_ID=' + os.environ['REPO_SECRETS_PUBLIC_KEY_ID'])
          print('PFM_DEBUG_KEYSTORE_SEALED=' + base64.b64encode(encrypted_value).decode('ascii'))
          print('Original keystore sealed; no signing key was generated or changed.')
          PY
