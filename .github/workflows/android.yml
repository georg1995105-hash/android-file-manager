name: android

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Постоянный DEBUG-ключ тестовых сборок между запусками CI, чтобы тестовые APK
      # обновлялись друг поверх друга. Это НЕ release-ключ.
      - name: Restore debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: pfm-debug-keystore-v1

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Inspect APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$SRC" > badging.txt
          VN=$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" badging.txt | head -1)
          VC=$(sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" badging.txt | head -1)
          PKG=$(sed -n "s/package: name='\([^']*\)'.*/\1/p" badging.txt | head -1)
          SHORT=$(echo "$GITHUB_SHA" | cut -c1-7)
          OUT="personal-file-manager-${VN}-vc${VC}-${SHORT}.apk"
          cp "$SRC" "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          echo "== package: $PKG  versionName: $VN  versionCode: $VC"
          echo "== permissions:"; grep "uses-permission" badging.txt || true
          echo "== native libs (.so):"; unzip -l "$OUT" | grep '\.so$' || echo "none"
          echo "== signer:"; "$BT/apksigner" verify --print-certs "$OUT" | grep -E "SHA-256|DN" || true
          cat "$OUT.sha256"
          ls -la "$OUT"
          {
            echo "file=$OUT"
            echo "version_name=$VN"
            echo "version_code=$VC"
            echo "sha256=$(cut -d' ' -f1 "$OUT.sha256")"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: |
            ${{ steps.apk.outputs.file }}
            ${{ steps.apk.outputs.file }}.sha256
          retention-days: 30

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7

      # Приватный пререлиз со скачиваемым APK — только для коммитов с меткой [apk].
      - name: Private prerelease
        if: contains(github.event.head_commit.message, '[apk]')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.apk.outputs.version_name }}-build${{ github.run_number }}"
          gh release create "$TAG" \
            "${{ steps.apk.outputs.file }}" "${{ steps.apk.outputs.file }}.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$TAG (DEBUG/TEST)" \
            --notes "DEBUG/TEST APK, не постоянная release-сборка. versionCode ${{ steps.apk.outputs.version_code }}. SHA-256: ${{ steps.apk.outputs.sha256 }}. Коммит $GITHUB_SHA. Подписан тестовым debug-ключом CI: release-версию поверх установить нельзя без удаления."
