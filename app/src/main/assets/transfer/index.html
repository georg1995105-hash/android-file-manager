<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Передача файлов</title><link rel="stylesheet" href="/style"><main><h1>Передача файлов</h1><p>Локальная сеть · HTTPS · без облака</p><section id="pair"><label>Имя устройства <input id="name" maxlength="60" value="Браузер"></label><input id="code" type="hidden"><button id="connect">Подключить</button></section><section id="session" hidden><h2>Получить</h2><button id="refresh">Обновить список</button><div id="files"></div><h2>Отправить</h2><label>Файлы <input id="pick" type="file" multiple></label><label>Папка <input id="folder" type="file" webkitdirectory multiple></label><p>Получатель подтверждает каждый файл. При обрыве оставьте страницу открытой и нажмите «Продолжить».</p><button id="send">Отправить выбранное</button><button id="resume">Продолжить</button><button id="cancel">Отменить текущий файл</button><progress id="progress" value="0" max="1"></progress></section><p id="status" role="status"></p></main><script src="/appjs"></script></html>
